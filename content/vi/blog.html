<p class="mrtu-lead">Cẩm nang của Mr Tu gồm những bài viết thực tế cho người thuê xe máy ở Hà Nội: chạy xe và gửi xe trong Phố Cổ, kiểm tra gì khi nhận xe, nên hỏi gì trước khi đặt xe. Giấy tờ, bằng lái và tiền cọc được giải thích đầy đủ ở trang <a href="/thu-tuc-thue-xe-may-ha-noi/">thủ tục thuê xe máy ở Hà Nội</a>.</p>
